        :root {

            --dourado-suave: #b59a6d;
            --fundo: #fdfaf5;
            --texto: #2c2c2c;
            --branco: #ffffff;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--fundo);
            color: var(--texto);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;

        .container {

            width: 100%;
            padding: 60px 20px;

        header {

            margin-bottom: 60px;
        }

        header h1 {
            font-family: 'Crimson Pro', serif;
            font-size: 3.5rem;
            font-weight: 400;
            margin: 0;
            color: var(--primaria);
        }

        header p {
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 0.8rem;
            color: var(--dourado-suave);
            margin-top: 10px;
        }

        .section-title {
            font-family: 'Crimson Pro', serif;
            font-size: 1.8rem;
            border-bottom: 1px solid #e0ddd7;
            padding-bottom: 10px;
            margin: 40px 0 25px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Grid de Cards das Histórias */
        .grid-biblioteca {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--branco);
            text-decoration: none;
            color: inherit;
            padding: 30px;
            border-radius: 2px;
            border: 1px solid #eee;
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 180px;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(74, 93, 77, 0.08);
            border-color: var(--primaria);
        }

        .card span {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--dourado-suave);
            margin-bottom: 10px;
        }

        .card h3 {
            font-family: 'Crimson Pro', serif;
            font-size: 1.5rem;
            margin: 0;
            font-weight: 400;
        }

        .card .btn-acessar {
            margin-top: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primaria);
            display: flex;
            align-items: center;
        }

        /* Grid das Atividades */
        .grid-atividades {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .card-mini {
            background: var(--primaria);
            color: white;
            text-decoration: none;
            padding: 20px;
            text-align: center;
            border-radius: 2px;
            transition: 0.3s;
        }

        .card-mini:hover {
            background: #3a4a3d;
        }

        .card-mini h4 {
            margin: 5px 0 0 0;
            font-family: 'Crimson Pro', serif;
            font-size: 1.2rem;
            font-weight: 400;
