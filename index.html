<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30 Dias com Deus | Painel</title>
    <style>
        /* Estilos embutidos para evitar erros de carregamento externo */
        body {
            background-color: #fdfaf5;
            color: #2c2c2c;
            font-family: 'Georgia', serif; /* Fonte padrão elegante que sempre funciona */
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 850px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            border-bottom: 1px solid #e0ddd7;
            padding-bottom: 30px;
        }

        header h1 {
            font-size: 3rem;
            margin: 0;
            color: #4a5d4d;
            font-weight: normal;
        }

        header p {
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.8rem;
            color: #b59a6d;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: white;
            border: 1px solid #eee;
            padding: 25px;
            text-decoration: none;
            color: inherit;
            transition: 0.3s;
            display: block;
        }

        .card:hover {
            border-color: #4a5d4d;
            background-color: #f9fbf9;
            transform: translateY(-3px);
        }

        .card span {
            color: #b59a6d;
            font-size: 0.7rem;
            text-transform: uppercase;
            display: block;
            margin-bottom: 10px;
        }

        .card h3 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: normal;
        }

        .secao-titulo {
            font-size: 1.2rem;
            margin-top: 40px;
            color: #4a5d4d;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-mini {
            background: #4a5d4d;
            color: white;
            padding: 15px;
            text-align: center;
            text-decoration: none;
            display: block;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <p>Infoproduto Exclusivo</p>
            <h1>30 Dias com Deus</h1>
        </header>

        <div class="secao-titulo">📖 Biblioteca de Histórias</div>
        <div class="grid">
            <a href="livros/H1-CRIACAO/historia1.html" class="card">
                <span>Módulo 01</span>
                <h3>A Criação</h3>
            </a>
            <a href="livros/H2-ADAO/historia2.html" class="card">
                <span>Módulo 02</span>
                <h3>Adão e Eva</h3>
            </a>
            <a href="livros/H3-ARCA/historia3.html" class="card">
                <span>Módulo 03</span>
                <h3>A Arca de Noé</h3>
            </a>
            <a href="livros/H4-ABRAAO/historia4.html" class="card">
                <span>Módulo 04</span>
                <h3>Abraão</h3>
            </a>
            <a href="livros/H5-JOSE/historia5.html" class="card">
                <span>Módulo 05</span>
                <h3>José do Egito</h3>
            </a>
        </div>

        <div class="secao-titulo">🎨 Atividades para Imprimir</div>
        <div class="grid" style="grid-template-columns: repeat(4, 1fr);">
            <a href="atividades/semana1.html" class="btn-mini">Semana 1</a>
            <a href="atividades/semana2.html" class="btn-mini">Semana 2</a>
            <a href="atividades/semana3.html" class="btn-mini">Semana 3</a>
            <a href="atividades/semana4.html" class="btn-mini">Semana 4</a>
        </div>
    </div>

</body>
</html>
